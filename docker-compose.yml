version: '3.8'

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quickfiller}
      MYSQL_USER: ${MYSQL_USER:-quickfiller}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quickfiller}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: .
    command: npm run migrate
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-quickfiller}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quickfiller}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quickfiller}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
    command: npm start
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-quickfiller}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quickfiller}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quickfiller}
    volumes:
      - storage_data:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
    command: npm run worker
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-quickfiller}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quickfiller}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quickfiller}
    volumes:
      - storage_data:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql_data:
  storage_data: